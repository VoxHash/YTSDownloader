# Experimental / manual-only PyInstaller freeze.
# NOT a required PR check. Do not treat a green run as a full cross-OS matrix.
# Hosted runners for this org have previously stayed queued (billing / pickup);
# if a dispatch stays "Queued", use the local scripts instead — see docs/installation.md.
name: Freeze (manual)

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Offscreen binary smoke after Linux freeze (SMOKE=1)"
        type: boolean
        default: true
      bundle_natives:
        description: "Best-effort build natives and copy native/bin into the onedir artifact"
        type: boolean
        default: true

concurrency:
  group: freeze-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freeze-linux:
    name: Linux onedir (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            gcc \
            golang-go \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build optional natives (best-effort)
        if: ${{ inputs.bundle_natives }}
        run: |
          chmod +x scripts/build_natives.sh
          # Fail soft per toolchain (cargo may be absent); freeze still ships Python fallbacks.
          ./scripts/build_natives.sh || true
          ls -la native/bin || true

      - name: Freeze with PyInstaller (onedir)
        env:
          # setup-python puts `python` on PATH; script defaults to .venv otherwise.
          YTS_PYTHON: python
          SMOKE: ${{ inputs.smoke && '1' || '0' }}
          BUNDLE_NATIVES: ${{ inputs.bundle_natives && '1' || '0' }}
        run: |
          chmod +x scripts/build_pyinstaller.sh
          ./scripts/build_pyinstaller.sh

      - name: Upload onedir artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTSDownloader-linux-onedir
          path: dist/YTSDownloader/
          if-no-files-found: error
          retention-days: 14
